digital_human:
  backend: minimax
  workflow: digital_human_infinitetalk
  tts_engine: minimax
  minimax_tts_model: speech-2.6-hd
  default_voice_id: female-shaonv
  default_emotion: neutral
  post:
    burn_subtitles: true
    loudnorm: true
    bgm: ''
    bgm_volume: 0.15
video_transform:
  backend: minimax
  resolution: 768P
  workflow: video_vace_transform
  face_detail_workflow: ''
auto_content:
  backend: minimax_llm
  video_aspect: '9:16'
  video_source: pexels
  voice_name: ''
  video_count: 1
  video_clip_duration: 5
publish:
  default_platform: douyin
  default_account: main
  auto_after_approve: false
  auto_schedule: now
schedules:
  enabled: true
  jobs:
  - id: publish_approved
    type: publish_approved
    cron: 0 21 * * *
    params:
      platform: douyin
