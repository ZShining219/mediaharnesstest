services:
  app:
    build: .
    container_name: aimf-app
    restart: unless-stopped
    ports:
      - "8800:8800"
    env_file: .env
    environment:
      # 容器内 sau 使用镜像内安装版本
      SAU_BIN: /usr/local/bin/sau
    volumes:
      - ./outputs:/app/outputs        # 作品产物(审核/发布)
      - ./assets:/app/assets          # 角色/素材
      - ./data:/app/data              # 任务库
      - ./config.yaml:/app/config.yaml
      - sau_cookies:/opt/sau/cookies  # 抖音登录态持久化

  # 素材管理器 OpenList (openlistteam/openlist, 中文现代网盘UI)
  # 挂载 ./assets 与 ./outputs —— 上传即被管线/画布引用
  assets-ui:
    image: openlistteam/openlist:latest
    container_name: aimf-assets
    restart: unless-stopped
    ports:
      - "3923:5244"
    volumes:
      - ./data/openlist:/opt/openlist/data
      - ./assets:/opt/openlist/mnt/assets
      - ./outputs:/opt/openlist/mnt/outputs

volumes:
  sau_cookies:
