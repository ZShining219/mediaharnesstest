services:
  app:
    build: .
    container_name: aimf-app
    restart: unless-stopped
    ports:
      - "8800:8800"
    env_file: .env
    environment:
      # 容器内 sau 使用镜像内安装版本
      SAU_BIN: /usr/local/bin/sau
    volumes:
      - ./outputs:/app/outputs        # 作品产物(审核/发布)
      - ./assets:/app/assets          # 角色/素材
      - ./data:/app/data              # 任务库
      - ./config.yaml:/app/config.yaml
      - sau_cookies:/opt/sau/cookies  # 抖音登录态持久化

  # 素材管理器 copyparty (github.com/9001/copyparty)
  # 直接管理 ./assets(素材) 与 ./outputs(产出) —— 传上去即可被画布引用
  assets-ui:
    image: copyparty/ac
    container_name: aimf-assets
    restart: unless-stopped
    ports:
      - "3923:3923"
    volumes:
      - ./assets:/w/assets
      - ./outputs:/w/outputs
      - ./data/copyparty:/cfg
    # 注意: 不要加 -c 参数——镜像的 /z/initcfg 会自动包含 /cfg 下所有 .conf
    # 配置文件: ./data/copyparty/copyparty.conf (含账号密码, 不进git)

volumes:
  sau_cookies:
