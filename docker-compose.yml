services:
  app:
    build: .
    container_name: aimf-app
    restart: unless-stopped
    ports:
      - "8800:8800"
    env_file: .env
    environment:
      # 容器内 sau 使用镜像内安装版本
      SAU_BIN: /usr/local/bin/sau
    volumes:
      - ./outputs:/app/outputs        # 作品产物(审核/发布)
      - ./assets:/app/assets          # 角色/素材
      - ./data:/app/data              # 任务库
      - ./config.yaml:/app/config.yaml
      - sau_cookies:/opt/sau/cookies  # 抖音登录态持久化

  # 素材管理器 copyparty (github.com/9001/copyparty)
  # 直接管理 ./assets(素材) 与 ./outputs(产出) —— 传上去即可被画布引用
  assets-ui:
    image: copyparty/ac
    container_name: aimf-assets
    restart: unless-stopped
    ports:
      - "3923:3923"
    volumes:
      - ./assets:/w/assets
      - ./outputs:/w/outputs
      - ./data/copyparty:/cfg
    environment:
      # 在 .env 设 ASSETS_PW (默认 admin)
      CPP: |
        --accounts admin:${ASSETS_PW:-admin}
        --volumes /w/assets:/w/assets:rwm:admin
        --volumes /w/outputs:/w/outputs:rwm:admin
        --e2dsa --e2ts --th-size 320x320 --theme 2
    # e2dsa=索引+搜索+缩略图  e2ts=媒体元数据  theme=暗色

volumes:
  sau_cookies:
